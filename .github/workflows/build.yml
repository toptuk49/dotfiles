name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [dev, sandbox]
    steps:
      - uses: actions/checkout@v4

      - name: Determine source branch
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PROFILE=${{ matrix.profile }}
            DOTFILES_BRANCH=${{ steps.ref.outputs.branch }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,scope=${{ matrix.profile }},mode=max

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        profile: [dev, sandbox]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: echo "tags=ghcr.io/${{ github.repository }}:${{ matrix.profile }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            PROFILE=${{ matrix.profile }}
            DOTFILES_BRANCH=main
          cache-from: type=gha,scope=${{ matrix.profile }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.profile }}-${{ matrix.arch }},mode=max
          platforms: linux/${{ matrix.arch }}
          annotations: |
            org.opencontainers.image.title=toptuk49/dotfiles
            org.opencontainers.image.description=Workflow configuration files and scripts.
            org.opencontainers.image.source=https://github.com/toptuk49/dotfiles
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  merge:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        profile: [dev, sandbox]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge arch manifests
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create \
            -t "$image:${{ matrix.profile }}" \
            "$image:${{ matrix.profile }}-amd64" \
            "$image:${{ matrix.profile }}-arm64"#
